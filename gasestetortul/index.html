<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tortul dispărut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: jucăuș, o mică poveste-mister de ziua lui
   IDEA: o consolă portabilă de jucărie, cu ecranul luminat
   PICTURE: casa văzută de sus, cu personaje pixelate
   COLOUR and TYPE: carcasă roșu-cireașă, ecran cald, Pixelify Sans
   LAYOUT: ecranul jocului sus, butoane dedesubt pe telefon */
:root{color-scheme:light dark;--bg:light-dark(#f7e6d4,#1d1418);--ink:light-dark(#2b1a1f,#f7e6d4);--shell:#c8323e;--shell2:#9e2430;--screen:#14101a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--screen);color:#fff8ee;font:16px/1.5 'Pixelify Sans',system-ui,sans-serif;overflow:hidden;display:grid;place-items:center}
.screen{position:relative;width:min(100vw,calc(100vh * 640 / 448));aspect-ratio:640/448}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hud{position:absolute;top:10px;right:14px;background:rgba(20,16,26,.7);padding:4px 12px;border-radius:8px;font-size:clamp(13px,2vw,18px);pointer-events:none}
.dlg{position:absolute;left:18px;right:18px;bottom:18px;background:#fff8ee;color:#2b1a1f;border:4px solid #2b1a1f;border-radius:8px;padding:12px 16px 26px;font-size:clamp(15px,2.4vw,19px);line-height:1.35;display:none;cursor:pointer}
.dlg b{display:block;color:var(--shell);font-size:.9em}
.dlg i{position:absolute;right:12px;bottom:4px;font-style:normal;font-size:13px;opacity:.7}
.over{position:absolute;inset:0;background:rgba(20,16,26,.88);color:#fff8ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.over h2{margin:0;font-size:clamp(28px,6vw,52px);line-height:1.05;text-wrap:balance}
.over p{margin:0;max-width:30em;font-size:clamp(15px,2.4vw,18px)}
.btn{font:inherit;font-size:18px;font-weight:600;background:#ffd23f;color:#2b1a1f;border:0;border-radius:10px;padding:10px 26px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 #b88f10}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="screen">
    <div class="hud" id="hud">Indicii: 0/3</div>
    <canvas id="c" width="640" height="448" aria-label="Jocul: casa văzută de sus"></canvas>
    <div class="dlg" id="dlg"><b id="who"></b><span id="txt"></span><i>E / atinge ▸</i></div>
    <div class="over" id="start">
      <p style="color:#ffd23f;font-weight:600">Misterul tortului dispărut</p>
      <h2>Tortul a dispărut!</h2>
      <p>E ziua ta, toată lumea e gata să cânte... dar tortul nu mai e pe masă. Găsește 3 indicii și prinde vinovatul.</p>
      <button class="btn" id="go">Start</button>
      <p style="font-size:14px;opacity:.8">Săgeți / WASD ca să mergi · E sau Spațiu ca să vorbești și să cercetezi</p>
    </div>
    <div class="over" id="end" style="display:none;background:rgba(20,16,26,.55)">
      <h2 id="endT">La mulți ani!</h2>
      <p id="endP"></p>
      <button class="btn" id="again">Mai joacă o dată</button>
    </div>
  </div>
<script>
{
// ===== Pune aici numele verișorului =====
const NUME = "vere";

const T = 32, W = 20, H = 14;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const MAP = [
"####################",
"#.........#........#",
"#.........#........#",
"#..................#",
"#.........#........#",
"#.........#........#",
"#.........#........#",
"#####.#########.####",
"#.........#........#",
"#.........#........#",
"#..................#",
"#.........#........#",
"#.........#........#",
"####################"];
const wall = (x,y) => MAP[y]?.[x] !== '.';
const room = (x,y) => y < 7 ? (x < 10 ? 'kit' : 'bed') : (x < 10 ? 'liv' : 'gar');
const FLOOR = {kit:['#e9dcc4','#dccdb1'], bed:['#b9a6d6','#ab97ca'], liv:['#c98f5d','#bd8352'], gar:['#7cc06a','#70b45e']};

let S; // starea jocului
function reset(){
  S = {px:3,py:11,fx:3,fy:11,dir:'up',moving:0,clues:new Set(),q:[],done:false,talked:{},t:0};
  hud();
}
const clueText = {crumbs:'firimituri', paw:'urmă de lăbuță', berry:'căpșună mușcată'};

// obiecte: x,y,w,h (în tile), draw, talk
const O = [
  {id:'table',x:4,y:10,w:2,h:1,draw:dTable,talk:()=>[['','Aici era tortul. Acum e doar o farfurie goală... și niște firimituri.']]},
  {id:'sofa',x:1,y:8,w:3,h:1,draw:dSofa,talk:()=>[['','Canapeaua. Ai căutat și sub perne. Doar o monedă și un ciorap.']]},
  {id:'crumbs',x:8,y:10,w:1,h:1,clue:1,draw:dSpark,talk:()=>clue('crumbs','Firimituri de tort! Se duc spre ușa din dreapta... spre grădină.')},
  {id:'fridge',x:1,y:1,w:1,h:2,draw:dFridge,talk:()=>[['','Frigiderul. Lapte, ouă, un borcan de murături. Niciun tort.']]},
  {id:'stove',x:3,y:1,w:2,h:1,draw:dStove,talk:()=>[['','Aragazul încă e cald. Tortul a fost copt de curând.']]},
  {id:'bunica',x:6,y:3,w:1,h:1,npc:1,draw:dGran,talk:()=>[['Bunica','Vai, puiule! L-am lăsat pe masă acum zece minute, cu frișcă și căpșuni deasupra.'],['Bunica','Când m-am întors, dispăruse! Cine ar face așa ceva?']]},
  {id:'bed',x:16,y:1,w:2,h:3,draw:dBed,talk:()=>[['','Un pat foarte moale. Cineva a dormit aici de curând. Are fire de păr gri pe pernă.']]},
  {id:'miti',x:15,y:2,w:1,h:1,npc:1,draw:dCat,talk:()=>[['Miți','Miaaau. Nu te uita așa la mine. Eu dorm de trei ore.'],['Miți','Dar... am auzit pe cineva lipăind pe hol. Cu lăbuțe mari. Și lipicioase.']]},
  {id:'paw',x:13,y:5,w:1,h:1,clue:1,draw:dSpark,talk:()=>clue('paw','O urmă de lăbuță... plină de frișcă! E prea mare pentru o pisică.')},
  {id:'lamp',x:11,y:1,w:1,h:1,draw:dLamp,talk:()=>[['','O veioză. Luminează. Atât.']]},
  {id:'bush1',x:17,y:11,w:2,h:2,draw:dBush,talk:()=>S.clues.has('berry')?[['','Doar frunze acum.']]:clue('berry','Ceva roșu sub tufiș... o căpșună mușcată! Exact ca cele de pe tort.')},
  {id:'bush2',x:11,y:12,w:1,h:1,draw:dBush,talk:()=>[['','Un tufiș mic. Și foarte nevinovat.']]},
  {id:'kennel',x:17,y:8,w:2,h:2,draw:dKennel,talk:()=>[['','Cușca lui Rex. Miroase a... vanilie?']]},
  {id:'rex',x:14,y:10,w:1,h:1,npc:1,draw:dDog,talk:rexTalk},
  {id:'berry',x:17,y:11,w:0,h:0,draw:()=>{}},
];
O.find(o=>o.id==='bush1').clue=1;

function clue(k,text){
  const fresh = !S.clues.has(k);
  S.clues.add(k); hud();
  const out = [['',text]];
  if(fresh) out.push(['','✦ Indiciu găsit: '+clueText[k]+' ('+S.clues.size+'/3)']);
  if(fresh && S.clues.size===3) out.push(['','Ai toate indiciile. E timpul să vorbești cu vinovatul...']);
  return out;
}
function rexTalk(){
  if(S.clues.size<3) return [['Rex','Ham! Eu? Eu sunt cel mai cuminte câine din lume.'],['Rex','(Are ceva alb pe nas. Dar fără dovezi nu poți spune nimic.)']];
  return [
    ['Tu','Rex. Firimituri. O urmă de lăbuță cu frișcă. O căpșună mușcată în tufiș.'],
    ['Rex','...'],['Rex','Ham. Bine. Recunosc.'],
    ['Rex','Dar n-am vrut să-l mănânc! Voiam doar să-l păzesc. Apoi a mirosit atât de bine...'],
    ['Rex','Am mâncat doar UN colț. Restul e în cușcă, întreg. Promit.'],
    ['','Scoți tortul din cușcă. Lipsește un colț, dar în rest e perfect.'],
    ['','Bunica aprinde lumânările. Miți se trezește. Rex dă din coadă vinovat.'],
    ['END','']];
}

function at(x,y){ return O.find(o=>o.w && x>=o.x && x<o.x+o.w && y>=o.y && y<o.y+o.h); }
const D = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

function step(dir){
  if(S.moving||S.q.length||S.done) return;
  S.dir = dir;
  const nx=S.px+D[dir][0], ny=S.py+D[dir][1];
  if(wall(nx,ny)||at(nx,ny)) return;
  S.px=nx; S.py=ny; S.moving=1;
}
function act(){
  if(S.done) return;
  if(S.q.length){ next(); return; }
  if(S.moving) return;
  let o = at(S.px+D[S.dir][0], S.py+D[S.dir][1]);
  if(!o) for(const d of Object.values(D)){ o = at(S.px+d[0],S.py+d[1]); if(o) break; }
  if(o) say(o.talk());
}
const dlg=document.getElementById('dlg'), who=document.getElementById('who'), txt=document.getElementById('txt');
function say(lines){ S.q = lines.slice(); show(); }
function show(){
  const l = S.q[0];
  if(!l){ dlg.style.display='none'; return; }
  if(l[0]==='END'){ S.q=[]; dlg.style.display='none'; win(); return; }
  who.textContent=l[0]; who.style.display=l[0]?'block':'none';
  txt.textContent=l[1]; dlg.style.display='block';
}
function next(){ S.q.shift(); show(); }
function hud(){ document.getElementById('hud').textContent='Indicii: '+S.clues.size+'/3'; }

// ===== final =====
let conf=[];
function win(){
  S.done=true;
  document.getElementById('endT').textContent='La mulți ani, '+NUME+'!';
  document.getElementById('endP').textContent='Ai rezolvat misterul. Tortul e salvat (aproape tot), iar Rex promite să nu mai fure. Să ai un an plin de aventuri și de tort!';
  document.getElementById('end').style.display='flex';
  const cols=['#ffd23f','#ff5d73','#5ec8ff','#7cff9a','#ffffff','#c78bff'];
  conf=Array.from({length:140},()=>({x:Math.random()*640,y:-Math.random()*448,v:1+Math.random()*2.2,s:4+Math.random()*5,c:cols[Math.random()*cols.length|0],w:Math.random()*6}));
}

// ===== desen =====
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
function shadow(x,y,w){ g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x+w/2,y+28,w/2.4,5,0,0,7); g.fill(); }
function dTable(o){const x=o.x*T,y=o.y*T; shadow(x,y,64); R(x+2,y+4,60,22,'#7a4a2b'); R(x+2,y+4,60,4,'#9a6340'); R(x+22,y+8,20,12,'#f4f1ea'); R(x+24,y+10,16,8,'#e6e0d4'); R(x+28,y+12,2,2,'#c9a77a'); R(x+34,y+13,2,2,'#c9a77a');}
function dSofa(o){const x=o.x*T,y=o.y*T; shadow(x,y,96); R(x+2,y+2,92,26,'#3f6fa8'); R(x+2,y+2,92,8,'#5a8cc6'); R(x+2,y+2,8,26,'#2f578a'); R(x+86,y+2,8,26,'#2f578a');}
function dFridge(o){const x=o.x*T,y=o.y*T; R(x+3,y+2,26,60,'#f2f4f7'); R(x+3,y+24,26,2,'#c7ccd4'); R(x+24,y+8,2,10,'#9aa1ad'); R(x+24,y+30,2,14,'#9aa1ad'); R(x+3,y+58,26,4,'#c7ccd4');}
function dStove(o){const x=o.x*T,y=o.y*T; R(x+2,y+2,60,28,'#4a4f58'); for(const cx of [14,46]){g.fillStyle='#22252a';g.beginPath();g.arc(x+cx,y+14,8,0,7);g.fill();g.strokeStyle='#e8573f';g.lineWidth=2;g.beginPath();g.arc(x+cx,y+14,5,0,7);g.stroke();}}
function dBed(o){const x=o.x*T,y=o.y*T; R(x+2,y+2,60,92,'#6b4a7d'); R(x+6,y+6,52,18,'#f6f0ff'); R(x+6,y+30,52,60,'#ff8fab'); R(x+6,y+30,52,6,'#ff6f94'); R(x+20,y+12,4,2,'#9a9aa6'); R(x+32,y+14,6,2,'#9a9aa6');}
function dLamp(o){const x=o.x*T,y=o.y*T; R(x+8,y+16,16,14,'#7a5c3a'); g.fillStyle='#ffe28a'; g.beginPath(); g.moveTo(x+6,y+16); g.lineTo(x+26,y+16); g.lineTo(x+21,y+4); g.lineTo(x+11,y+4); g.fill(); g.fillStyle='rgba(255,226,138,.18)'; g.beginPath(); g.arc(x+16,y+14,26,0,7); g.fill();}
function dBush(o){const x=o.x*T,y=o.y*T,w=o.w*T,h=o.h*T; g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x+w/2,y+h-4,w/2.2,6,0,0,7); g.fill();
  for(const [a,b,r,c] of [[.3,.55,.32,'#2f7a3b'],[.7,.55,.32,'#2f7a3b'],[.5,.38,.36,'#3f9a4b'],[.45,.3,.16,'#5cb867']]){g.fillStyle=c;g.beginPath();g.arc(x+w*a,y+h*b,Math.min(w,h)*r,0,7);g.fill();}
  if(o.id==='bush1'&&!S.clues.has('berry')) dSpark({x:o.x+1,y:o.y+1});}
function dKennel(o){const x=o.x*T,y=o.y*T; shadow(x,y+30,64); R(x+6,y+22,52,38,'#b5653a'); g.fillStyle='#8e4625'; g.beginPath(); g.moveTo(x+2,y+24); g.lineTo(x+32,y+4); g.lineTo(x+62,y+24); g.fill(); R(x+22,y+36,20,24,'#3a1f12'); R(x+24,y+44,6,4,'#fff8ee'); R(x+28,y+42,8,6,'#ff8fab');}
function dSpark(o){ if(o.id&&S.clues.has(o.id)) return; const x=o.x*T+16,y=o.y*T+16,k=(Math.sin(S.t/180)+1)/2;
  g.fillStyle='rgba(255,230,120,'+(.25+.35*k)+')'; g.beginPath(); g.arc(x,y,8+5*k,0,7); g.fill();
  g.fillStyle='#fff6c4'; g.beginPath(); g.moveTo(x,y-9); g.lineTo(x+3,y-3); g.lineTo(x+9,y); g.lineTo(x+3,y+3); g.lineTo(x,y+9); g.lineTo(x-3,y+3); g.lineTo(x-9,y); g.lineTo(x-3,y-3); g.fill();}
function bob(){ return Math.round(Math.sin(S.t/300)*1.5); }
function dGran(o){const x=o.x*T,y=o.y*T+bob(); shadow(x,y-bob(),32); R(x+8,y+14,16,16,'#7b4fa0'); R(x+6,y+24,20,6,'#6a3f8f'); R(x+10,y+4,12,11,'#f1c7a5'); R(x+9,y+1,14,5,'#d9d9e3'); R(x+20,y+2,5,5,'#d9d9e3'); R(x+12,y+8,2,2,'#2b1a1f'); R(x+18,y+8,2,2,'#2b1a1f'); R(x+11,y+7,4,1,'#8a8a96'); R(x+17,y+7,4,1,'#8a8a96'); R(x+12,y+18,8,8,'#fff8ee');}
function dCat(o){const x=o.x*T,y=o.y*T; shadow(x,y,32); R(x+6,y+16,20,12,'#8d8f9a'); R(x+18,y+8,12,12,'#8d8f9a'); R(x+18,y+5,3,4,'#8d8f9a'); R(x+27,y+5,3,4,'#8d8f9a'); R(x+21,y+13,3,1,'#2b1a1f'); R(x+26,y+13,3,1,'#2b1a1f'); R(x+2,y+18,6,3,'#8d8f9a'); R(x+10,y+18,6,2,'#a7a9b3');
  g.fillStyle='#fff8ee'; g.font='12px "Pixelify Sans"'; const z=(S.t/600|0)%3; g.fillText('z'.repeat(z+1),x+26,y+2);}
function dDog(o){const x=o.x*T,y=o.y*T+bob(); shadow(x,y-bob(),32); R(x+4,y+14,20,12,'#a8642f'); R(x+16,y+6,14,12,'#a8642f'); R(x+16,y+6,4,10,'#7a4520'); R(x+26,y+14,5,4,'#2b1a1f'); R(x+23,y+10,2,2,'#2b1a1f'); R(x+24,y+12,6,3,'#fffdf6'); R(x+6,y+26,4,4,'#7a4520'); R(x+18,y+26,4,4,'#7a4520'); const w=Math.sin(S.t/90)>0?-2:0; R(x+1,y+12+w,4,4,'#a8642f');}
function dPlayer(x,y,dir){ shadow(x,y,32); const legs=S.moving?((S.t/90|0)%2)*2:0;
  R(x+10,y+24,5,6-legs,'#2b2f4a'); R(x+17,y+24,5,4+legs,'#2b2f4a'); R(x+8,y+13,16,12,'#3b8ee8'); R(x+8,y+13,16,3,'#5aa8ff'); R(x+10,y+3,12,11,'#f1c7a5'); R(x+9,y+1,14,5,'#5a3825');
  if(dir!=='up'){ const ox=dir==='left'?-2:dir==='right'?2:0; R(x+12+ox,y+8,2,2,'#2b1a1f'); R(x+18+ox,y+8,2,2,'#2b1a1f'); } else R(x+9,y+3,14,8,'#5a3825');
  R(x+12,y+0,8,2,'#ffd23f'); }

function draw(){
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(wall(x,y)){ R(x*T,y*T,T,T,'#4a2f3a'); R(x*T,y*T+T-6,T,6,'#38222b'); if(y<H-1&&!wall(x,y+1)) R(x*T,y*T+T-4,T,4,'#2a1820'); }
    else { const f=FLOOR[room(x,y)]; R(x*T,y*T,T,T,f[(x+y)%2]); if(room(x,y)==='gar'&&(x*7+y*3)%5===0) R(x*T+10,y*T+12,2,5,'#5aa04c'); }
  }
  // tablouri pe pereți
  R(2*T,7*T+6,40,18,'#ffd23f'); R(2*T+4,7*T+10,32,10,'#5ec8ff'); R(12*T,7*T+6,24,18,'#fff8ee'); R(12*T+4,7*T+10,16,10,'#ff8fab');
  const list = O.slice().sort((a,b)=>(a.y+a.h)-(b.y+b.h));
  let pd=false;
  for(const o of list){ if(!pd && o.y+o.h>S.fy+1){ dPlayer(S.fx*T,S.fy*T,S.dir); pd=true; } o.draw(o); }
  if(!pd) dPlayer(S.fx*T,S.fy*T,S.dir);
  // etichete camere
  g.font='13px "Pixelify Sans"'; g.fillStyle='rgba(43,26,31,.55)';
  g.fillText('Bucătăria',T+4,6*T+22); g.fillText('Dormitorul',11*T+4,6*T+22); g.fillText('Sufrageria',T+4,13*T-8); g.fillStyle='rgba(20,60,20,.55)'; g.fillText('Grădina',11*T+4,9*T+20);
  if(S.done){ for(const p of conf){ p.y+=p.v; p.x+=Math.sin((p.y+p.w*40)/30)*.8; if(p.y>460){p.y=-10;p.x=Math.random()*640;} R(p.x,p.y,p.s,p.s*.6,p.c);} }
}

let last=0; const held=[];
function loop(t){
  const dt=Math.min(50,t-last); last=t; S.t=t;
  if(S.moving){ const sp=dt/110; const dx=S.px-S.fx, dy=S.py-S.fy;
    S.fx+=Math.sign(dx)*Math.min(Math.abs(dx),sp); S.fy+=Math.sign(dy)*Math.min(Math.abs(dy),sp);
    if(S.fx===S.px&&S.fy===S.py) S.moving=0; }
  if(!S.moving && held.length && started.hidden) step(held[held.length-1]);
  draw(); requestAnimationFrame(loop);
}

// ===== control =====
const KEY={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
const started={hidden:false};
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.code==='Space'||e.code==='Enter')) return;
  const d=KEY[e.code];
  if(d){ e.preventDefault(); if(!held.includes(d)) held.push(d); }
  if(['KeyE','Space','Enter'].includes(e.code)){ e.preventDefault(); if(started.hidden) act(); }
});
addEventListener('keyup',e=>{ const d=KEY[e.code]; const i=held.indexOf(d); if(i>-1) held.splice(i,1); });
addEventListener('blur',()=>held.length=0);
