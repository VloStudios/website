<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cum să scriem mesaje pe rețelele de socializare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a0b4a;
    --pink:#fbe7fb; --peach:#fee6d6; --lav:#c9c4fb; --rose:#fecbcb; --mint:#d4f1df; --cream:#eeeee6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#111;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1600px}
  .deck{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  /* "Switch"-style transition, like PowerPoint */
  .slide{position:absolute;inset:0;padding:6.5% 7%;overflow:hidden;opacity:0;pointer-events:none;
    transition:opacity .9s ease, transform 1.1s cubic-bezier(.4,0,.2,1)}
  .slide.past{transform:translateX(-35%) rotateY(55deg) scale(.75)}
  .slide.future{transform:translateX(35%) rotateY(-55deg) scale(.75)}
  .slide.active{opacity:1;transform:none;pointer-events:auto;z-index:2}
  .slide h1,.slide h2{font-family:"Bodoni Moda",serif;font-weight:400;line-height:1.05;letter-spacing:-.01em}
  .slide h2{font-size:min(6.2vw,11vh);margin-bottom:4%}
  .slide.active h2{animation:titleIn .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes titleIn{from{opacity:0;transform:translateY(30px);letter-spacing:.08em}to{opacity:1;transform:none}}
  .body{font-size:min(2.35vw,4.2vh);line-height:1.55;max-width:92%}
  .body p{margin-bottom:.55em}
  .body small{font-size:.5em;opacity:.85}
  .body a{color:inherit}
  .label{font-weight:700;margin-top:.4em}
  .quote{font-style:italic}

  /* fragments + effects */
  .f{position:relative;transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1), clip-path .8s ease-out}
  /* Strips (diagonal, from top-left) */
  .fx-strips .f{clip-path:polygon(0 0,0 0,0 0,0 0);transition:clip-path 1.1s ease-out}
  .fx-strips .f.on{clip-path:polygon(0 0,250% 0,250% 0,0 250%)}
  /* Fly In (from bottom) */
  .fx-fly .f{opacity:0;transform:translateY(120%)}
  .slide.fx-fly .f.on{opacity:1;transform:none}
  /* Checkerboard: grid of cells in the slide colour that wipe away */
  .fx-checker .f{opacity:0}
  .slide.fx-checker .f.on{opacity:1;transition:none}
  .cb{position:absolute;inset:-2px;display:grid;grid-template-columns:repeat(14,1fr);grid-auto-rows:1fr;pointer-events:none}
  .cb i{background:var(--bg);transform-origin:left;transform:scaleX(1);transition:transform .35s linear}
  .f.on .cb i{transform:scaleX(0)}
  .f.on .cb i.o{transition-delay:.3s}

  /* title & end slides */
  .hero{background:var(--cream);display:flex;flex-direction:column;justify-content:center}
  .hero .who{font-size:min(1.9vw,3.4vh);position:absolute;top:9%;left:7%}
  .hero h1{font-size:min(8.2vw,14.5vh);max-width:60%;position:relative;z-index:2}
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.9;z-index:1}
  .hero .b1{width:36%;height:80%;right:10%;top:10%;background:radial-gradient(circle at 40% 50%,#ff9a3c,#ff5c8a 55%,transparent 72%);animation:float 9s ease-in-out infinite}
  .hero .b2{width:30%;height:70%;right:2%;top:5%;background:radial-gradient(circle,#ee6ad8,#f7a1ec 50%,transparent 72%);animation:float 11s ease-in-out infinite reverse}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4%,5%) scale(1.08)}}
  .end{background:linear-gradient(90deg,#fb9c62,#f56f86 45%,#ef7fd7 75%,#f1b9ee);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .end h1{font-size:min(7vw,12.5vh);max-width:80%}
  .end .who{margin-top:6%;font-size:min(1.9vw,3.4vh)}
  .slide.active.hero h1,.slide.active.end h1{animation:titleIn 1.2s cubic-bezier(.2,.8,.2,1) both}

  /* layout with phones */
  .split{display:flex;gap:4%;align-items:flex-start}
  .split .body{flex:1}
  .phones{display:flex;gap:3%;flex-shrink:0;justify-content:flex-end}
  .phones.row4{justify-content:space-between;width:100%;margin-top:1%}
  .phone{width:min(14vw,25vh);aspect-ratio:9/19;border-radius:1.4em;padding:.6em .5em;position:relative;overflow:hidden;
    font-size:min(.9vw,1.6vh);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
  .row4 .phone{width:min(19vw,33vh)}
  .phone.light{background:linear-gradient(160deg,#c9d3f7,#e3c6f2 45%,#a8d7f0);color:#111}
  .phone.dark{background:#000;color:#eee}
  .phone .top{display:flex;justify-content:space-between;font-weight:700;font-size:.85em;padding:0 .4em}
  .phone .top .t{background:#34c759;color:#fff;border-radius:1em;padding:0 .5em}
  .phone .who2{text-align:center;margin-top:.8em}
  .phone .av{width:2.6em;height:2.6em;border-radius:50%;margin:0 auto .3em;display:grid;place-items:center;font-weight:700}
  .light .av{background:linear-gradient(135deg,#7a8c4a,#c9b37a)}
  .dark .av{background:#5b5670;color:#ddd}
  .phone .name{display:inline-block;font-size:.85em;padding:.1em .6em;border-radius:1em}
  .light .name{background:rgba(255,255,255,.6)}
  .dark .name{background:#222}
  .msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:1.2em}
  .bubble{align-self:flex-end;max-width:85%;padding:.5em .7em;border-radius:1.1em;line-height:1.35;margin-bottom:.4em}
  .light .bubble{background:#2f8cff;color:#fff}
  .dark .bubble{background:#34c759;color:#fff}
  .slide.active .bubble{animation:bubbleIn .6s .5s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes bubbleIn{from{opacity:0;transform:translateY(20px) scale(.7)}to{opacity:1;transform:none}}
  .phone .bar{margin-top:auto;border-radius:1em;padding:.4em .7em;font-size:.85em}
  .light .bar{background:rgba(255,255,255,.55);color:#888}
  .dark .bar{background:#1c1c1e;color:#777}
  .kb{background:#2b2b2e;border-radius:.8em;margin:.4em -.2em -.3em;height:34%;
    background-image:radial-gradient(circle,#555 32%,transparent 34%);background-size:10% 22%;background-position:5% 20%}

  /* email compare */
  .cmp{display:flex;gap:4%}
  .card{flex:1;background:rgba(255,255,255,.55);border-radius:1em;padding:3% 4%;font-size:.9em}
  .card .label{font-size:1.15em;margin:0 0 .4em}
  .card.no .label{color:#b3123a}
  .card.yes .label{color:#137a3a}


  /* ---------- games ---------- */
  .slide{overflow:clip}
  .game h2{margin-bottom:2.5%}
  .game .body{max-width:100%;font-size:min(1.95vw,3.5vh);line-height:1.45}
  .ia{cursor:pointer}
  .chat{display:flex;flex-direction:column;gap:.55em;margin-top:.4em}
  .fixrow{display:flex;align-items:center;gap:.6em}
  .num{font-weight:700}
  .bub{font:inherit;border:0;text-align:left;max-width:80%;padding:.45em .9em;border-radius:1.1em 1.1em 1.1em .3em;color:#fff;position:relative;
    transition:background .4s, transform .3s, opacity .5s}
  .bub.bad{background:#7b7b85}
  .bub.bad:hover{transform:scale(1.03)}
  .bub .tap{display:block;font-size:.55em;opacity:.8;margin-top:.15em}
  .bub.good{background:#2f8cff;border-radius:1.1em 1.1em .3em 1.1em}
  .bub.trash{animation:trash .6s ease forwards}
  .bub.gone{animation:none;background:transparent;color:var(--ink);font-style:italic;opacity:1;transform:none}
  @keyframes trash{to{transform:translateX(40%) rotate(8deg) scale(.6);opacity:0}}
  .bub.glitch{background:#e0245e;animation:glitch .55s steps(2) both}
  @keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-6px,2px) skewX(8deg)}40%{transform:translate(5px,-2px) skewX(-6deg)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0) skewX(4deg)}100%{transform:none}}
  .opts{display:flex;flex-direction:column;gap:.45em;margin:.3em 0 .5em}
  .opt{font:inherit;text-align:left;border:2px solid rgba(42,11,74,.25);background:rgba(255,255,255,.55);color:var(--ink);border-radius:.8em;padding:.35em .8em;
    transition:background .3s, border-color .3s, transform .2s}
  .opt:hover{transform:translateX(6px);background:rgba(255,255,255,.8)}
  .opt.right{background:#34c759;border-color:#1e9e44;color:#fff;transform:scale(1.03)}
  .opt.wrong{background:#ff6b81;border-color:#d63a55;color:#fff;animation:shake .5s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .why{opacity:0;transform:translateY(12px);transition:.5s}
  .why.show{opacity:1;transform:none}
  .tf{display:flex;flex-direction:column;gap:.35em}
  .tfrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.2em 1em;background:rgba(255,255,255,.45);border-radius:.7em;padding:.25em .7em;transition:background .4s}
  .tfq{font-size:.92em}
  .tfwhy{grid-column:1/-1;font-size:.72em;display:none}
  .tfrow.done .tfwhy{display:block;animation:titleIn .5s both}
  .tfrow.done .tfb{opacity:.35;pointer-events:none}
  .tfrow.right{background:rgba(52,199,89,.45)}
  .tfrow.wrong{background:rgba(255,107,129,.5);animation:shake .5s}
  .gbtn{font:inherit;font-size:.7em;border:0;border-radius:2em;padding:.3em .9em;margin-left:.3em;background:var(--ink);color:#fff;transition:transform .2s}
  .gbtn:hover{transform:scale(1.08)}
  .gbar{display:flex;align-items:center;justify-content:flex-end;gap:.3em;margin-top:.5em;font-size:.85em}
  .gbar .votes,.gbar .score{margin-right:auto;font-size:.8em}
  .timer.run{background:#f05c8a;animation:pulse 1s infinite}
  .timer.over{background:#e0245e}
  @keyframes pulse{50%{transform:scale(1.12)}}

  /* UI */
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff;font-size:13px;
    opacity:0;transition:opacity .3s;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,.45))}
  body:hover #ui{opacity:1}
  #ui button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
  #ui button:hover{background:rgba(255,255,255,.3)}
  #count{margin-left:auto}
  #progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#ff9a3c,#f05c8a,#c67ae8);z-index:11;transition:width .5s ease}
  #hint{position:fixed;top:14px;right:16px;color:#fff;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;font-size:13px;z-index:12;transition:opacity 1s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="progress"></div>
<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;z-index:20"></canvas>
<div id="hint">→ / click = următorul · ← = înapoi · F = fullscreen</div>
<div id="stage"><div class="deck" id="deck"></div></div>
<div id="ui">
  <button id="prev" aria-label="Înapoi">←</button>
  <button id="next" aria-label="Înainte">→</button>
  <button id="fs">Fullscreen</button>
  <span id="count"></span>
</div>

<script>
const C = {pink:'var(--pink)',peach:'var(--peach)',lav:'var(--lav)',rose:'var(--rose)',mint:'var(--mint)'};

// phone chat mockups (recreated from the original screenshots)
const P = {
  profOk:  {theme:'light', time:'17:08', name:'prof. dr. Heinz Doofenshmirtz', msg:'Bună ziua, domnule profesor! Îmi puteți vă rog spune ce temă am avut? Mulțumesc!'},
  profBad: {theme:'light', time:'17:08', name:'prof. dr. Heinz Doofenshmirtz', msg:'sal profu trimite pls tema ca nam fost atent hai tpup mersi pa'},
  friendBad:{theme:'dark', time:'18:01', name:'un anume prieten bun', msg:'sal bashski cf boss n vdm l park l lotu l ora doișe hai tpup pa'},
  friendOk: {theme:'dark', time:'18:05', name:'un anume prieten bun', msg:'Bello frate, ne vdm la lotus în parcare la două?'}
};

const S = [
  {type:'hero'},
  {t:'Introducere', c:'pink', p:[
    'Această prezentare vă va învăța cum să scrieți mesaje corect, cum să vă adresați profesorilor și cum să <b>NU</b> faceți dintr-o glumă o situație neplăcută.',
    'Rețelele de socializare au devenit o parte importantă din viețile noastre, dar mulți nu le folosim corect, și <b>o situație în care nu ne-am exprimat corect poate fi interpretată greșit.</b>']},
  {t:'Comunicarea online', c:'peach', p:[
    'Comunicarea online nu e limitată la mesaje text, include și mesajele audio, mesajele/notele video <small>(<a href="https://playtech.ro/2024/whatsapp-introduce-modul-video-note-in-camera-o-noua-modalitate-de-inregistrare-a-mesajelor-video/" target="_blank">playtech.ro</a>)</small>, comentarii, postări, email-uri (mai rar folosite în ziua de azi) și grupuri.']},
  {t:'Ce este neticheta?', c:'lav', p:[
    'Neticheta <small>(cuvânt format din cuvintele net și eticheta)</small> se referă la totalitatea regulilor de etichetă (conduită) ce trebuie respectate pe internet. Cuvântul se referă la cum să ne purtăm cu alții pe internet, ce fel de glume să facem, etc.',
    'TL;DR <small>(cuvânt slang care înseamnă Too Long; Didn\'t Read)</small>, neticheta înseamnă să ne purtăm cu ceilalți cum vrem să se poarte ei cu noi pe internet.']},
  {t:'De ce contează modul în care scriem?', c:'rose', p:[
    'Mesajele care nu sunt scrise corect, folosesc prea multe cuvinte "slang" sau folosesc prea multe prescurtări neadecvate pot fi înțelese greșit.',
    'Putem folosi slang-uri când vorbim cu prietenii, dar când vorbim cu profesorii sau cu alte persoane importante, este necesar să folosim cât mai puține din aceste slang-uri.']},
  {t:'Aici aveți patru exemple', c:'mint', phones4:['profOk','profBad','friendBad','friendOk'], p:[]},
  {t:'Primele 2 exemple, explicate', c:'pink', phones:['profOk','profBad'], p:[
    'Primul exemplu arată cum ar trebui să îi scriem unui profesor. Eu mă adresez într-o manieră politicoasă domnului Doof și îl întreb frumos care e tema.',
    'Al doilea exemplu arată cum <b>NU</b> ar trebui să-i scriem unui profesor. Eu mă adresez într-o manieră nepoliticoasă domnului Doof și îl întreb într-un mod greu de înțeles care e tema.']},
  {t:'Ultimele 2 exemple, explicate', c:'peach', phones:['friendBad','friendOk'], p:[
    'În primul exemplu, mă adresez unui anume prieten bun într-un mod foarte greu de înțeles și pentru cineva care știe slang-uri, pentru că folosesc prescurtări pe care nu le înțelege toată lumea.',
    'În al doilea exemplu, îi scriu cu mai puține slanguri, mai inteligibil ce am vrut să spun.']},
  {t:'Cyberbullying', c:'lav', p:[
    'Cyberbullyingul este o formă de agresiune pe internet, care poate părea mai "anonimă" pentru că poți face un profil fals, dar majoritatea site-urilor detectează conturile alternative după adresa IP.',
    'Chiar dacă pare anonim, agresorul poate fi aproape mereu identificat și tras la răspundere. Platformele și furnizorii de internet păstrează date care pot fi cerute de poliție. Dacă ești victima cyberbullying-ului, nu răspunde, fă capturi de ecran și spune unui părinte sau profesor.']},
  {t:'Conversațiile în grupuri', c:'mint', phones:['profOk','friendOk'], p:[
    'În grupurile cu elevi și profesori, este important să păstrăm o manieră potrivită (ca și în ex.1), indiferent cu cine vorbim.',
    'În grupurile doar cu elevi, ne permitem să vorbim și ca în exemplul 2, nu <b>doar</b> ca în exemplul 1.']},
  {t:'În general...', c:'pink', p:[
    'În general, un elev nu își permite să îi scrie profesorului în privat dacă nu e ceva foarte urgent. Dacă vrem să îi scriem ceva ce nu e urgent unui profesor, îi spunem unui părinte să contacteze diriginta care mai apoi va lua legătura cu profesorul.']},
  {t:'Majusculele', c:'peach', p:[
    'În viața de zi cu zi, este necesar să evităm mesajele NUMAI CU MAJUSCULE. Unii oameni pot interpreta aceste mesaje ca și ordine sau lucruri similare.',
    'Este important să nu scriem mesaje cu mAjUsCuLe aLtErNaTe <small>(text cunoscut ca Mocking SpongeBob)</small> fiindcă ele simbolizează o bătaie de joc, mai ales dacă repetăm ce a spus ceva în viața reală.']},
  {t:'Mesajele vocale', c:'lav', p:[
    'Mesajele vocale trebuie trimise corect, într-un loc unde nu este multă gălăgie în spate, vorbind clar și tare, ca să nu fie auzite cuvintele altfel.',
    'Mesajele vocale trebuie trimise mai mult când nu ai posibilitatea să trimiți mesaje scrise, și trebuie înțeles că mesajele vocale nu sunt ascultate mereu imediat ce sunt trimise, pentru că destinatarul poate fi într-o situație în care nu poate asculta chiar atunci mesajul.']},
  {t:'Respectul', c:'rose', p:[
    'Când vorbim cu cineva mai mic, de aceași vârstă sau mai mare ca noi, față-în-față, pe grupuri de chat sau în DM-uri <small>(DM – acronim de la Direct Message(s))</small>, trebuie să o facem cu respect. Este recomandat să folosim cuvintele "te rog"/"mulțumesc" sau acronimele "pls"/"ty", dacă vorbim cu prietenii sau colegii.',
    'Putem folosi slang-uri când vorbim cu colegii, dar este important să nu facem mesajul greu de înțeles.']},
  {t:'Respectarea intimității', c:'lav', p:[
    'Când vorbim în online, este important să respectăm intimitatea altora. Dacă cineva ne trimite poze, înainte să le distribuim trebuie să întrebăm dacă acea persoană ne permite să distribuim pozele.',
    'Dacă cineva ne spune ceva intim sau un secret, trebuie să ținem acel lucru pentru noi în loc să bârfim și să distribuim.']},
  {t:'Tonul mesajului', c:'pink', p:[
    'Când vorbim față-în-față, ceilalți ne aud tonul și ne văd fața. Într-un mesaj, nu.',
    '„ok.” poate să pară supărat, chiar dacă tu doar ai fost grăbit. „ok!” sună cu totul altfel.',
    'De asta e bine să recitim mesajul înainte să îl trimitem și să ne întrebăm: cum o să sune pentru cel care îl citește?']},
  {t:'„Lasă că îl șterg”', c:'peach', p:[
    'Mulți cred că dacă șterg un mesaj de pe grup, a dispărut pentru totdeauna. Nu prea.',
    'Durează o secundă să faci un screenshot. Mesajul șters poate ajunge în 10 grupuri până apuci tu să apeși pe „Delete for everyone”.',
    'Regula mea: dacă nu ai spune-o în fața clasei, nu o scrie.']},
  {t:'Înjurăturile pe grupul clasei', c:'lav', p:[
    'Hai să fim sinceri: pe aproape orice grup al clasei se înjură. Uneori „în glumă”, alteori la nervi.',
    'Problema e că grupul nu e o conversație între doi prieteni. Acolo sunt toți colegii, iar mesajele pot ajunge foarte ușor la părinți, la diriginta sau chiar la direcțiune.',
    'Ce ție ți se pare o glumă, pe altcineva îl poate răni de-adevăratelea.']},
  {t:'De ce nu e ok?', c:'rose', p:[
    '• Un screenshot cu tine înjurând poate ajunge oriunde',
    '• Nu toți colegii înțeleg gluma la fel',
    '• Înjurătura nu rezolvă cearta, doar o face mai mare',
    '• Dacă înjuri pe cineva de mai multe ori, deja e cyberbullying',
    'Test simplu: dacă ți-ar fi rușine să o citească mama ta, nu o scrie pe grup.']},
  {t:'Când ești nervos', c:'pink', p:[
    'Cele mai urâte mesaje se scriu la nervi. Și tot pe ele le regretăm cel mai tare a doua zi.',
    'Un truc simplu: scrie mesajul, dar nu îl trimite. Mai așteaptă 10 minute. De cele mai multe ori o să îl ștergi singur.',
    'Dacă te-a supărat cineva, vorbește cu el în privat sau față-în-față, nu în fața a 30 de oameni.']},
  {t:'Seen și „k”', c:'peach', p:[
    'Să lași pe cineva pe seen sau să răspunzi doar cu „k” poate să pară nepoliticos, mai ales dacă persoana ți-a scris ceva important.',
    'Nu trebuie să răspunzi imediat, dar e frumos să răspunzi. Chiar și un simplu „acum nu pot, îți scriu mai târziu” e mult mai bine decât nimic.']},
  {t:'Mesajul către profesor', c:'lav', p:[
    'Fie că e pe WhatsApp, pe Teams sau pe email, un mesaj către un profesor are câteva reguli:',
    '• Începem cu „Bună ziua, doamna profesoară,”',
    '• Ne prezentăm, dacă profesorul nu are numărul nostru',
    '• Mesaj scurt și la obiect',
    '• Încheiem cu „Vă mulțumesc!”',
    'Și nu scriem la 11 noaptea.']},
  {t:'Așa da, așa nu', c:'rose', html:`
    <div class="cmp">
      <div class="card no f"><p class="label">Așa NU:</p><p>Subiect: (gol)</p><p class="quote">„salut cand e testu?? ca nu am fost azi”</p></div>

    items:[

function phone(key){
  const d = P[key];
  return `<div class="phone ${d.theme}">
    <div class="top"><span class="t">${d.time}</span><span>${d.theme==='light'?'5G':'LTE'} ▮</span></div>
    <div class="who2"><div class="av">${d.theme==='dark'?'U':''}</div><span class="name">${d.name} ›</span></div>
    <div class="msgs"><div class="bubble">${d.msg}</div></div>
    <div class="bar">${d.theme==='light'?'Message':'Text Message • SMS'}</div>
    ${d.theme==='light'?'<div class="kb"></div>':''}
  </div>`;
}


// ---------- interactive games ----------
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function gameBar(extra=''){ return `<div class="gbar ia">${extra}<button class="gbtn timer" data-s="30">⏱ 30 s</button><button class="gbtn reset" title="Resetează jocul">↺</button></div>`; }
function renderFix(s){
  return `<div class="body"><p class="f">${s.intro}</p>
    <div class="chat">${s.items.map((it,k)=>`<div class="fixrow f"><span class="num">${k+1}.</span>
      <button class="bub bad ia" data-good="${it.good===null?'':esc(it.good)}" data-bad="${esc(it.bad)}">${esc(it.bad)}<span class="tap">apasă să repari</span></button></div>`).join('')}</div>
    ${gameBar()}</div>`;
}
function renderChoice(s){
  return `<div class="body"><p class="f">${s.q}</p>
    <div class="opts">${s.opts.map((o,k)=>`<button class="opt ia f" data-k="${k}" data-ok="${k===s.ok}"><b>${'abc'[k]})</b> ${o}</button>`).join('')}</div>
    <p class="why"><b>Răspuns: ${'abc'[s.ok]}.</b> ${s.why}</p>
    ${gameBar('<span class="votes">Votați cu mâna sus, apoi apăs eu!</span>')}</div>`;
}
function renderTF(s){
  return `<div class="body"><div class="tf">${s.items.map((it,k)=>`<div class="tfrow f" data-a="${it.a}">
      <span class="tfq">${k+1}. ${it.q}</span>
      <span class="tfb ia"><button class="gbtn tbtn" data-v="true">Adevărat</button><button class="gbtn tbtn" data-v="false">Fals</button></span>
      <span class="tfwhy">${it.a?'Adevărat':'Fals'}. ${it.why}</span></div>`).join('')}</div>
    ${gameBar('<span class="score">Scor clasă: <b>0</b> / '+s.items.length+'</span>')}</div>`;
}

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide future';
  if(s.type==='hero'){
    el.classList.add('hero');
    el.innerHTML = `<div class="who">Pop Vlad-Andrei</div><div class="blob b1"></div><div class="blob b2"></div><h1>Cum să scriem mesaje pe rețelele de socializare</h1>`;
  } else if(s.type==='end'){
    el.classList.add('end');
    el.innerHTML = `<h1>Mulțumesc pentru atenție!</h1><div class="who">Pop Vlad-Andrei</div>`;
  } else {
    el.style.background = C[s.c];
    el.style.setProperty('--bg', C[s.c]);
    el.classList.add('fx-' + (s.fx || (s.c==='peach' ? 'checker' : 'strips')));
    const paras = (s.p||[]).map(x=>`<p class="f">${x}</p>`).join('');
    let inner;
    if(s.type==='fix') inner = renderFix(s);
    else if(s.type==='choice') inner = renderChoice(s);
    else if(s.type==='tf') inner = renderTF(s);
    else if(s.html) inner = `<div class="body">${s.html}</div>`;
    else if(s.phones) inner = `<div class="split"><div class="body">${paras}</div><div class="phones">${s.phones.map(phone).join('')}</div></div>`;
    else if(s.phones4) inner = `<div class="phones row4">${s.phones4.map(k=>`<div class="f">${phone(k)}</div>`).join('')}</div>`;
    else inner = `<div class="body">${paras}</div>`;
    el.innerHTML = `<h2>${s.t}</h2>${inner}`;
    if(s.type) el.classList.add('game');
  }
  deck.appendChild(el);
});

deck.querySelectorAll('.fx-checker .f').forEach(f=>{
  const cb=document.createElement('div'); cb.className='cb';
  const rows=Math.max(1,Math.round(f.offsetHeight/28)||3);
  for(let r=0;r<rows;r++) for(let c=0;c<14;c++){const i=document.createElement('i'); if((r+c)%2) i.className='o'; cb.appendChild(i);}
  f.appendChild(cb);
});
const slides = [...deck.children];

// game interactions
function confetti(x,y){
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#ff9a3c','#f05c8a','#c67ae8','#34c759','#2f8cff','#ffd23f'];
  const ps=Array.from({length:140},()=>({x,y,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*6,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t=0;
  (function f(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(++t<110) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height); })();
}
function typeInto(el, text, done){
  el.textContent=''; let i=0;
  const iv=setInterval(()=>{ el.textContent=text.slice(0,++i); if(i>=text.length){clearInterval(iv); done&&done();} }, 28);
}
function resetGame(sl){
  sl.querySelectorAll('.bub').forEach(b=>{b.className='bub bad ia'; b.innerHTML=esc(b.dataset.bad)+'<span class="tap">apasă să repari</span>';});
  sl.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));
  sl.querySelector('.why')?.classList.remove('show');
  sl.querySelectorAll('.tfrow').forEach(r=>r.classList.remove('right','wrong','done'));
  const sc=sl.querySelector('.score b'); if(sc) sc.textContent='0';
  const tm=sl.querySelector('.timer'); if(tm){clearInterval(tm._iv); tm.textContent='⏱ 30 s'; tm.classList.remove('run','over');}
}
deck.addEventListener('click', e=>{
  const sl=e.target.closest('.slide');
  const bub=e.target.closest('.bub');
  if(bub && bub.classList.contains('bad')){
    bub.classList.remove('bad'); bub.classList.add('glitch');
    setTimeout(()=>{
      bub.classList.remove('glitch');
      if(bub.dataset.good){ bub.classList.add('good'); typeInto(bub, bub.dataset.good, ()=>{const r=bub.getBoundingClientRect(); confetti(r.right,r.top);}); }
      else { bub.classList.add('trash'); setTimeout(()=>{bub.classList.add('gone'); bub.innerHTML='🚫 Mesaj netrimis. Varianta corectă: să nu-l trimitem deloc.';},600); }
    },550);
    return;
  }
  const opt=e.target.closest('.opt');
  if(opt && !opt.classList.contains('right')){
    if(opt.dataset.ok==='true'){ opt.classList.add('right'); sl.querySelector('.why').classList.add('show'); const r=opt.getBoundingClientRect(); confetti(r.left+r.width/2,r.top); }
    else { opt.classList.remove('wrong'); void opt.offsetWidth; opt.classList.add('wrong'); }
    return;
  }
  const tb=e.target.closest('.tbtn');
  if(tb){ const row=tb.closest('.tfrow'); if(row.classList.contains('done')) return;
    const right = tb.dataset.v===row.dataset.a; row.classList.add('done', right?'right':'wrong');
    if(right){ const sc=sl.querySelector('.score b'); sc.textContent=+sc.textContent+1; const r=tb.getBoundingClientRect(); confetti(r.left+r.width/2,r.top); }
    return;
  }
  const tm=e.target.closest('.timer');
  if(tm){ clearInterval(tm._iv); let n=+tm.dataset.s; tm.classList.add('run'); tm.classList.remove('over'); tm.textContent='⏱ '+n+' s';
    tm._iv=setInterval(()=>{ n--; tm.textContent='⏱ '+n+' s'; if(n<=0){clearInterval(tm._iv); tm.textContent='⏰ Gata!'; tm.classList.remove('run'); tm.classList.add('over');} },1000);
    return;
  }
  if(e.target.closest('.reset')) resetGame(sl);
});

let cur = 0, step = 0;
const frags = el => [...el.querySelectorAll('.f')];

function render(){
  slides.forEach((el,i)=>{
    el.classList.toggle('active', i===cur);
    el.classList.toggle('past', i<cur);
    el.classList.toggle('future', i>cur);
  });
  frags(slides[cur]).forEach((f,k)=>f.classList.toggle('on', k<step));
  document.getElementById('count').textContent = `${cur+1} / ${slides.length}`;
  document.getElementById('progress').style.width = ((cur+1)/slides.length*100)+'%';
  history.replaceState(null,'','#'+(cur+1));
}
function next(){
  const n = frags(slides[cur]).length;
  if(step < n){ step++; render(); }
  else if(cur < slides.length-1){ cur++; step = 0; render(); }
}
function prev(){
  if(step > 0){ step--; render(); }
  else if(cur > 0){ cur--; step = frags(slides[cur]).length; render(); }
}
function fullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='f' || e.key==='F') fullscreen();
  else if(e.key==='Home'){ cur=0; step=0; render(); }
  else if(e.key==='End'){ cur=slides.length-1; step=0; render(); }
});
document.getElementById('stage').addEventListener('click', e=>{
  if(e.target.closest('a, .ia')) return;
  (e.clientX < innerWidth*0.25) ? prev() : next();
});
document.getElementById('next').onclick = e=>{e.stopPropagation(); next();};
document.getElementById('prev').onclick = e=>{e.stopPropagation(); prev();};
document.getElementById('fs').onclick = e=>{e.stopPropagation(); fullscreen();};
let tx = null;
addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
addEventListener('touchend', e=>{
  if(tx===null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 50) (dx < 0 ? next() : prev());
  tx = null;
});

const start = parseInt(location.hash.slice(1),10);
if(start>=1 && start<=slides.length) cur = start-1;
render();
setTimeout(()=>{ document.getElementById('hint').style.opacity = 0; }, 4000);
</script>
