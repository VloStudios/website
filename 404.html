<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - not here</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var seg = location.pathname.split("/")[1];
      var isProject = location.hostname.endsWith(".github.io") && seg;
      var root = isProject ? "/" + seg + "/" : "/";
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="main" class="lost">
    <h1>404</h1>
    <p>nothing here. the page wandered off, or never existed.</p>
    <p><a href="./">go home</a></p>
    <!-- me when the page doesn't exist -->
  </main>
</body>
</html>
